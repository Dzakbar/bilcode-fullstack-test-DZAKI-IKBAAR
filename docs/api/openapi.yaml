openapi: 3.0.3
info:
  title: ProjectPulse API
  description: |
    ProjectPulse — Platform Manajemen Klien & Proyek Internal.
    Backend Laravel 13 dengan Sanctum token auth untuk web (admin) dan mobile (member).

    Base URL: `http://localhost:8000/api`

    Autentikasi: Bearer token (dari login).
  version: 1.0.0

servers:
  - url: http://localhost:8000/api
    description: Local Docker development

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      operationId: healthCheck
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                success: true
                message: ProjectPulse backend is healthy
                data:
                  status: ok
                  service: projectpulse-backend

  /auth/admin/login:
    post:
      tags: [Authentication]
      summary: Admin login
      operationId: adminLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: admin@projectpulse.test
                password:
                  type: string
                  format: password
                  example: password
                device_name:
                  type: string
                  example: web-browser
      responses:
        "201":
          description: Admin login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Wrong role for this endpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /auth/member/login:
    post:
      tags: [Authentication]
      summary: Member login
      operationId: memberLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: developer1@projectpulse.test
                password:
                  type: string
                  format: password
                  example: password
                device_name:
                  type: string
                  example: ionic-local
      responses:
        "201":
          description: Member login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Wrong role for this endpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /auth/me:
    get:
      tags: [Authentication]
      summary: Get current authenticated user
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authenticated user retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Logout and revoke current token
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"

  /auth/profile:
    put:
      tags: [Authentication]
      summary: Update profile name
      operationId: updateProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 255
                  example: Updated Name
      responses:
        "200":
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /admin/clients:
    get:
      tags: [Admin - Clients]
      summary: List clients
      operationId: listClients
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          schema: { type: string }
          description: Search name, email, company
        - name: company
          in: query
          schema: { type: string }
          description: Filter by company
        - name: per_page
          in: query
          schema: { type: integer, default: 10, maximum: 100 }
        - name: sort
          in: query
          schema: { type: string, enum: [name, company, created_at, updated_at], default: created_at }
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        "200":
          description: Clients retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Client"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags: [Admin - Clients]
      summary: Create client
      operationId: createClient
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name:
                  type: string
                  maxLength: 255
                  example: PT Example Indonesia
                email:
                  type: string
                  format: email
                  example: client@example.test
                company:
                  type: string
                  maxLength: 255
                  example: Example Group
      responses:
        "201":
          description: Client created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    $ref: "#/components/schemas/Client"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /admin/clients/{id}:
    get:
      tags: [Admin - Clients]
      summary: Show client
      operationId: showClient
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Client retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    $ref: "#/components/schemas/Client"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [Admin - Clients]
      summary: Update client (full)
      operationId: updateClientPut
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, example: PT Updated }
                email: { type: string, format: email }
                company: { type: string }
      responses:
        "200":
          description: Client updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    $ref: "#/components/schemas/Client"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

    patch:
      tags: [Admin - Clients]
      summary: Update client (partial)
      operationId: updateClientPatch
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string, format: email }
                company: { type: string }
      responses:
        "200":
          description: Client updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    $ref: "#/components/schemas/Client"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

    delete:
      tags: [Admin - Clients]
      summary: Delete client
      operationId: deleteClient
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Client deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Conflict - client has related projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/projects:
    get:
      tags: [Admin - Projects]
      summary: List projects
      operationId: listProjects
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          schema: { type: string }
          description: Search name, brief, client name, client company
        - name: client_id
          in: query
          schema: { type: integer }
          description: Filter by client ID
        - name: status
          in: query
          schema:
            type: string
            enum: [planning, active, completed, cancelled]
        - name: deadline_from
          in: query
          schema: { type: string, format: date }
        - name: deadline_to
          in: query
          schema: { type: string, format: date }
        - name: overdue
          in: query
          schema: { type: boolean }
          description: Deadline before today and status not completed/cancelled
        - name: per_page
          in: query
          schema: { type: integer, default: 10, maximum: 100 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, deadline, status, created_at, updated_at]
            default: created_at
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        "200":
          description: Projects retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags: [Admin - Projects]
      summary: Create project
      operationId: createProject
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, name]
              properties:
                client_id:
                  type: integer
                  example: 1
                name:
                  type: string
                  maxLength: 255
                  example: ProjectPulse Website
                brief:
                  type: string
                  example: Build a project management platform
                deadline:
                  type: string
                  format: date
                  example: "2026-09-30"
                status:
                  type: string
                  enum: [planning, active, completed, cancelled]
                  default: planning
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /admin/projects/{id}:
    get:
      tags: [Admin - Projects]
      summary: Show project
      operationId: showProject
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Project retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags: [Admin - Projects]
      summary: Update project (full)
      operationId: updateProjectPut
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id: { type: integer }
                name: { type: string }
                brief: { type: string, nullable: true }
                deadline: { type: string, format: date, nullable: true }
                status:
                  type: string
                  enum: [planning, active, completed, cancelled]
      responses:
        "200":
          description: Project updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

    patch:
      tags: [Admin - Projects]
      summary: Update project (partial)
      operationId: updateProjectPatch
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id: { type: integer }
                name: { type: string }
                brief: { type: string, nullable: true }
                deadline: { type: string, format: date, nullable: true }
                status:
                  type: string
                  enum: [planning, active, completed, cancelled]
      responses:
        "200":
          description: Project updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

    delete:
      tags: [Admin - Projects]
      summary: Delete project
      operationId: deleteProject
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Project deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Conflict - project has related tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/tasks:
    get:
      tags: [Admin - Tasks]
      summary: List tasks
      operationId: listTasks
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          schema: { type: string }
          description: Search title, description, project name, assignee name/email
        - name: project_id
          in: query
          schema: { type: integer }
        - name: client_id
          in: query
          schema: { type: integer }
        - name: assignee_id
          in: query
          schema: { type: integer }
        - name: category
          in: query
          schema:
            type: string
            enum: [frontend, backend, design, qa]
        - name: status
          in: query
          schema:
            type: string
            enum: [todo, in_progress, review, done]
        - name: deadline_from
          in: query
          schema: { type: string, format: date }
        - name: deadline_to
          in: query
          schema: { type: string, format: date }
        - name: overdue
          in: query
          schema: { type: boolean }
        - name: unassigned
          in: query
          schema: { type: boolean }
        - name: per_page
          in: query
          schema: { type: integer, default: 10, maximum: 100 }
        - name: sort
          in: query
          schema:
            type: string
            enum: [title, deadline, status, category, estimated_effort, created_at, updated_at]
            default: created_at
        - name: direction
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        "200":
          description: Tasks retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginatedResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags: [Admin - Tasks]
      summary: Create task
      operationId: createTask
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, title, category]
              properties:
                project_id:
                  type: integer
                  example: 1
                assignee_id:
                  type: integer
                  nullable: true
                  example: 2
                title:
                  type: string
                  maxLength: 255
                  example: Implement authentication API
                description:
                  type: string
                  maxLength: 5000
                  nullable: true
                category:
                  type: string
                  enum: [frontend, backend, design, qa]
                  example: backend
                estimated_effort:
                  type: integer
                  minimum: 1
                  maximum: 80
                  nullable: true
                  example: 8
                deadline:
                  type: string
                  format: date
                  nullable: true
                status:
                  type: string
                  enum: [todo, in_progress, review, done]
                  default: todo
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /admin/tasks/{id}:
    get:
      tags: [Admin - Tasks]
      summary: Show task
      operationId: showTask
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Task retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
