services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-projectpulse}
      POSTGRES_USER: ${DB_USERNAME:-projectpulse}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-projectpulse_change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - projectpulse

  backend:
    build:
      context: ./backend
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-projectpulse}
      DB_USERNAME: ${DB_USERNAME:-projectpulse}
      DB_PASSWORD: ${DB_PASSWORD:-projectpulse_change_me}
    secrets:
      - backend_env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "php -r \"exit(@file_get_contents('http://127.0.0.1:8000/api/health') === false ? 1 : 0);\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - projectpulse

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: http://localhost:8000/api
    depends_on:
      backend:
        condition: service_started
    ports:
      - "3000:80"
    networks:
      - projectpulse

volumes:
  postgres_data:

networks:
  projectpulse:

secrets:
  backend_env:
    file: ./backend/.env
