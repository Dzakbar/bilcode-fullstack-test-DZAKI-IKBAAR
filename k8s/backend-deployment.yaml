apiVersion: apps/v1
kind: Deployment
metadata:
  name: projectpulse-backend
  labels:
    app.kubernetes.io/name: projectpulse-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: projectpulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: projectpulse-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: projectpulse-backend
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: projectpulse
    spec:
      containers:
        - name: backend
          # Local image: build it locally, then load it into minikube/kind/k3d.
          image: projectpulse-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: projectpulse-config
            - secretRef:
                name: projectpulse-secret
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
