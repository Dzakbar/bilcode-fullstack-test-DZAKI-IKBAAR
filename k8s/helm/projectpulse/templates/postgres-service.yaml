apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.postgres.name }}
  labels:
    {{- include "projectpulse.postgres.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "projectpulse.postgres.matchLabels" . | nindent 4 }}
  ports:
    - name: postgres
      port: {{ .Values.postgres.port }}
      targetPort: postgres
      protocol: TCP
