apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.backend.name }}
  labels:
    {{- include "projectpulse.backend.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "projectpulse.backend.matchLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
      protocol: TCP
