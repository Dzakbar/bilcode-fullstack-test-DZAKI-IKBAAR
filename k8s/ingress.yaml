# Requires an ingress-nginx controller in the local cluster (for example,
# `minikube addons enable ingress`). Map projectpulse.local to the ingress IP.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: projectpulse-ingress
  labels:
    app.kubernetes.io/part-of: projectpulse
spec:
  ingressClassName: nginx
  rules:
    - host: projectpulse.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: projectpulse-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: projectpulse-web
                port:
                  number: 80
